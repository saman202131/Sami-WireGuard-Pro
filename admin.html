<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>
    Sami WireGuard — Admin
  </title>

  <meta
    name="robots"
    content="noindex,nofollow"
  />

  <link
    rel="stylesheet"
    href="/admin.css"
  />
</head>

<body>

  <!-- =====================================================
       LOGIN
       ===================================================== -->

  <section
    id="loginScreen"
    class="admin-login-screen"
  >

    <div class="admin-login-glow"></div>

    <div class="admin-login-card">

      <div class="admin-login-brand">

        <div class="admin-brand-mark">
          S
        </div>

        <div>
          <strong>
            SAMI
          </strong>

          <span>
            WIREGUARD
          </span>
        </div>

      </div>

      <div class="admin-login-heading">

        <span>
          CONTROL CENTER
        </span>

        <h1>
          ورود مدیر
        </h1>

        <p>
          مدیریت فروشگاه، سفارش‌ها و سرویس‌ها
        </p>

      </div>

      <form
        id="loginForm"
        class="admin-login-form"
      >

        <label>

          <span>
            نام کاربری
          </span>

          <input
            id="loginUsername"
            type="text"
            autocomplete="username"
            placeholder="admin"
            required
          />

        </label>

        <label>

          <span>
            رمز عبور
          </span>

          <input
            id="loginPassword"
            type="password"
            autocomplete="current-password"
            placeholder="••••••••"
            required
          />

        </label>

        <button
          id="loginButton"
          type="submit"
          class="admin-primary-button admin-login-button"
        >
          ورود به پنل
        </button>

        <div
          id="loginMessage"
          class="admin-login-message"
        ></div>

      </form>

      <div class="admin-login-footer">
        SAMI // PRIVATE ADMIN
      </div>

    </div>

  </section>


  <!-- =====================================================
       ADMIN APP
       ===================================================== -->

  <div
    id="adminApp"
    class="admin-app"
    style="display:none;"
  >

    <!-- ===================================================
         SIDEBAR
         =================================================== -->

    <aside
      id="adminSidebar"
      class="admin-sidebar"
    >

      <div class="admin-sidebar-top">

        <div class="admin-sidebar-brand">

          <div class="admin-brand-mark">
            S
          </div>

          <div class="admin-brand-text">

            <strong>
              SAMI
            </strong>

            <span>
              WIREGUARD
            </span>

          </div>

        </div>

        <div class="admin-online">

          <span></span>

          SYSTEM ONLINE

        </div>

      </div>


      <!-- MENU -->

      <nav
        id="adminMenu"
        class="admin-menu"
      >

        <div class="admin-menu-label">
          MAIN
        </div>

        <button
          type="button"
          class="admin-menu-item active"
          data-page="dashboard"
        >
          <span class="menu-icon">
            ◈
          </span>

          <span>
            داشبورد
          </span>
        </button>


        <div class="admin-menu-label">
          STORE
        </div>

        <button
          type="button"
          class="admin-menu-item"
          data-page="categories"
        >
          <span class="menu-icon">
            ▦
          </span>

          <span>
            دسته‌بندی‌ها
          </span>
        </button>

        <button
          type="button"
          class="admin-menu-item"
          data-page="products"
        >
          <span class="menu-icon">
            ◫
          </span>

          <span>
            محصولات
          </span>
        </button>

        <button
          type="button"
          class="admin-menu-item"
          data-page="orders"
        >
          <span class="menu-icon">
            ◎
          </span>

          <span>
            سفارش‌ها
          </span>
        </button>


        <div class="admin-menu-label">
          USERS
        </div>

        <button
          type="button"
          class="admin-menu-item"
          data-page="customers"
        >
          <span class="menu-icon">
            ◉
          </span>

          <span>
            مشتریان
          </span>
        </button>

        <button
          type="button"
          class="admin-menu-item"
          data-page="services"
        >
          <span class="menu-icon">
            ⌁
          </span>

          <span>
            سرویس‌ها
          </span>
        </button>

        <button
          type="button"
          class="admin-menu-item"
          data-page="tickets"
        >
          <span class="menu-icon">
            ▱
          </span>

          <span>
            تیکت‌ها
          </span>
        </button>


        <div class="admin-menu-label">
          MARKETING
        </div>

        <button
          type="button"
          class="admin-menu-item"
          data-page="coupons"
        >
          <span class="menu-icon">
            %
          </span>

          <span>
            کدهای تخفیف
          </span>
        </button>

        <button
          type="button"
          class="admin-menu-item"
          data-page="flash-sale"
        >
          <span class="menu-icon">
            ⚡
          </span>

          <span>
            Flash Sale
          </span>
        </button>

        <button
          type="button"
          class="admin-menu-item"
          data-page="wheel"
        >
          <span class="menu-icon">
            ◌
          </span>

          <span>
            گردونه شانس
          </span>
        </button>


        <div class="admin-menu-label">
          SYSTEM
        </div>

        <button
          type="button"
          class="admin-menu-item"
          data-page="servers"
        >
          <span class="menu-icon">
            ▤
          </span>

          <span>
            سرورها
          </span>
        </button>

        <button
          type="button"
          class="admin-menu-item"
          data-page="telegram"
        >
          <span class="menu-icon">
            ➤
          </span>

          <span>
            تلگرام
          </span>
        </button>

        <button
          type="button"
          class="admin-menu-item"
          data-page="notifications"
        >
          <span class="menu-icon">
            ♢
          </span>

          <span>
            اعلان‌ها
          </span>
        </button>

        <button
          type="button"
          class="admin-menu-item"
          data-page="analytics"
        >
          <span class="menu-icon">
            ◒
          </span>

          <span>
            آمار
          </span>
        </button>

        <button
          type="button"
          class="admin-menu-item"
          data-page="audit"
        >
          <span class="menu-icon">
            ≡
          </span>

          <span>
            گزارش فعالیت
          </span>
        </button>


        <div class="admin-menu-label">
          CONFIG
        </div>

        <button
          type="button"
          class="admin-menu-item"
          data-page="settings"
        >
          <span class="menu-icon">
            ⚙
          </span>

          <span>
            تنظیمات
          </span>
        </button>

        <button
          type="button"
          class="admin-menu-item"
          data-page="backup"
        >
          <span class="menu-icon">
            ⇩
          </span>

          <span>
            پشتیبان‌گیری
          </span>
        </button>

      </nav>


      <!-- SIDEBAR FOOTER -->

      <div class="admin-sidebar-footer">

        <div class="admin-secure-box">

          <span class="secure-dot"></span>

          <div>

            <strong>
              SECURE MODE
            </strong>

            <small>
              ADMIN ACCESS
            </small>

          </div>

        </div>

        <button
          type="button"
          class="admin-logout-button"
          onclick="adminLogout()"
        >
          خروج از پنل
        </button>

      </div>

    </aside>


    <!-- ===================================================
         MAIN
         =================================================== -->

    <main class="admin-main">

      <!-- TOPBAR -->

      <header class="admin-topbar">

        <div class="admin-topbar-right">

          <button
            id="mobileMenuButton"
            type="button"
            class="admin-mobile-menu-button"
            aria-label="منو"
          >
            ☰
          </button>

          <div class="admin-page-heading">

            <span
              id="pageKicker"
              class="admin-page-kicker"
            >
              CONTROL CENTER
            </span>

            <h1 id="pageTitle">
              داشبورد
            </h1>

          </div>

        </div>


        <div class="admin-topbar-left">

          <div class="admin-live-status">

            <span></span>

            LIVE

          </div>

          <button
            id="refreshButton"
            type="button"
            class="admin-refresh-button"
            title="بروزرسانی"
          >
            ↻
          </button>

        </div>

      </header>


      <!-- PAGE CONTENT -->

      <section
        id="content"
        class="admin-content"
      >

        <div class="admin-loading">
          در حال بارگذاری...
        </div>

      </section>

    </main>

  </div>


  <!-- =====================================================
       MODAL
       ===================================================== -->

  <div
    id="adminModal"
    class="admin-modal-overlay"
    style="display:none;"
  >

    <div class="admin-modal">

      <div class="admin-modal-header">

        <div>

          <span class="admin-modal-kicker">
            SAMI ADMIN
          </span>

          <h2 id="modalTitle">
            مدیریت
          </h2>

        </div>

        <button
          id="modalClose"
          type="button"
          class="admin-modal-close"
          aria-label="بستن"
        >
          ×
        </button>

      </div>

      <div
        id="modalContent"
        class="admin-modal-content"
      ></div>

    </div>

  </div>


  <!-- =====================================================
       TOAST
       ===================================================== -->

  <div
    id="adminToast"
    class="admin-toast"
  ></div>


  <!-- =====================================================
       SCRIPT
       ===================================================== -->

  <script src="/admin.js"></script>

</body>

</html>
