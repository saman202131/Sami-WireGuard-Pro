<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدیریت | Sami WireGuard</title><link rel="stylesheet" href="/style.css"><style>
.admin-wrap{max-width:760px;margin:auto}.admin-panel{background:#101827;border:1px solid var(--line);padding:18px;border-radius:20px;margin:14px 0}.admin-panel h2{font-size:17px}.field{display:block;margin:12px 0;font-size:12px;color:#aebbd0}.field input,.field textarea,.field select{display:block;width:100%;margin-top:7px;background:#080e19;border:1px solid #2b3951;border-radius:10px;padding:12px;color:#fff;font:inherit}.switchrow{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:13px 0}.switch{width:48px;height:27px;border-radius:30px;border:0;background:#394459;padding:3px}.switch:after{content:"";display:block;width:21px;height:21px;background:#fff;border-radius:50%;transition:.2s}.switch.on{background:#1dba85}.switch.on:after{transform:translateX(-21px)}.hidden{display:none}.order-actions{display:flex;gap:8px;margin-top:10px}.muted{color:var(--muted);font-size:11px}
</style></head><body><div class="admin-wrap">
<header class="topbar"><div class="brandmark">S<span>W</span></div><div class="brandcopy"><b>مدیریت Sami WireGuard</b><small>ADMIN CONSOLE</small></div><a class="quick-card" style="width:auto;padding:10px" href="/">فروشگاه ↗</a></header>
<section id="login" class="admin-panel"><h2>ورود مدیر</h2><p class="muted">رمز عبوری که در Environment تنظیم کرده‌ای وارد کن.</p><label class="field">رمز مدیریت<input type="password" id="password" autocomplete="current-password"></label><button class="primary-btn" id="loginBtn">ورود به پنل</button><p id="loginError" class="muted"></p></section>
<section id="dashboard" class="hidden">
<div class="admin-panel"><h2>وضعیت سرویس‌ها</h2><p class="muted">خاموش‌کردن، خرید آن سرویس را در فروشگاه می‌بندد؛ برای قطع واقعی کاربران باید API پنل متصل شود.</p><div id="switches"></div></div>
<div class="admin-panel"><h2>اطلاعیه فروشگاه</h2><label class="field">متن صفحه اصلی<textarea id="announcement" rows="3"></textarea></label><button class="primary-btn" id="saveBtn">ذخیره تنظیمات</button><p id="saveMsg" class="muted"></p></div>
<div class="admin-panel"><h2>سفارش‌ها</h2><button class="primary-btn" id="refreshOrders">به‌روزرسانی سفارش‌ها</button><div id="orders" style="margin-top:12px"></div></div>
</section></div><div class="toast" id="toast"></div>
<script>
let token="",config=null;const $=id=>document.getElementById(id);
function say(s){$("toast").textContent=s;$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),2500)}
async function api(url,opts={}){const r=await fetch(url,{...opts,headers:{"Content-Type":"application/json","Authorization":"Bearer "+token,...(opts.headers||{})}});const d=await r.json();if(!r.ok)throw Error(d.error||"خطا");return d}
$("loginBtn").onclick=async()=>{try{const r=await fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:$("password").value})});const d=await r.json();if(!r.ok)throw Error(d.error);token=d.token;config=await api("/api/admin/config");$("login").classList.add("hidden");$("dashboard").classList.remove("hidden");render();loadOrders()}catch(e){$("loginError").textContent=e.message}};
function render(){$("announcement").value=config.announcement||"";$("switches").innerHTML=config.services.map(s=>`<div class="switchrow"><div><b>${s.name}</b><div class="muted">${s.enabled?"در فروشگاه فعال است":"در فروشگاه غیرفعال است"}</div></div><button class="switch ${s.enabled?"on":""}" data-id="${s.id}" aria-label="تغییر وضعیت ${s.name}"></button></div>`).join("");document.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>{const s=config.services.find(x=>x.id===b.dataset.id);s.enabled=!s.enabled;render()})}
$("saveBtn").onclick=async()=>{try{config.announcement=$("announcement").value;const d=await api("/api/admin/config",{method:"PUT",body:JSON.stringify(config)});config={...config,...d.config};render();$("saveMsg").textContent="تنظیمات ذخیره شد.";say("ذخیره شد")}catch(e){say(e.message)}};
async function loadOrders(){try{const orders=await api("/api/admin/orders");$("orders").innerHTML=orders.length?orders.map(o=>`<div class="plan" style="display:block"><b>${o.id} · ${o.serviceName}</b><small>${o.planTitle} · ${new Intl.NumberFormat("fa-IR").format(o.price)} تومان</small><small>وضعیت: ${o.status} · ${new Date(o.createdAt).toLocaleString("fa-IR")}</small><div class="order-actions"><button class="primary-btn" data-order="${o.id}" data-status="approved">تأیید</button><button class="primary-btn" style="background:#a94e62" data-order="${o.id}" data-status="rejected">رد</button></div></div>`).join(""):"<p class='muted'>هنوز سفارشی ثبت نشده است.</p>";document.querySelectorAll("[data-order]").forEach(b=>b.onclick=async()=>{try{await api("/api/admin/orders/"+b.dataset.order,{method:"PATCH",body:JSON.stringify({status:b.dataset.status})});loadOrders();say("وضعیت سفارش به‌روزرسانی شد")}catch(e){say(e.message)}})}catch(e){say(e.message)}}
$("refreshOrders").onclick=loadOrders;
</script></body></html>
