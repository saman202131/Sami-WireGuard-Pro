<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sami WireGuard - پنل مدیریت</title>
  <link rel="stylesheet" href="/admin.css">
</head>

<body>

  <div id="login" class="login">
    <div class="login-card">

      <div class="logo">
        ⚡ SAMI <b>WIREGUARD</b>
      </div>

      <h1>پنل مدیریت حرفه‌ای</h1>

      <p>مدیریت فروش، سفارش‌ها، تلگرام و تنظیمات</p>

      <input
        id="u"
        type="text"
        placeholder="نام کاربری"
        value="admin"
        autocomplete="username"
      >

      <input
        id="p"
        type="password"
        placeholder="رمز عبور"
        autocomplete="current-password"
        onkeydown="if(event.key==='Enter') login()"
      >

      <button
        class="primary"
        type="button"
        onclick="login()"
      >
        🔐 ورود مدیریت
      </button>

      <div id="le" class="error"></div>

    </div>
  </div>


  <div id="app" class="hidden">

    <aside>

      <div class="side-brand">
        ⚡ <b>SAMI</b>
        <span>WIREGUARD</span>
      </div>

      <div id="who" class="who"></div>

      <nav id="nav"></nav>

      <button
        class="logout"
        type="button"
        onclick="logout()"
      >
        🚪 خروج
      </button>

    </aside>


    <main>

      <header class="top">

        <div>
          <small>CONTROL CENTER</small>
          <h1 id="title">داشبورد</h1>
        </div>

        <a
          class="store-link"
          href="/"
        >
          🛒 مشاهده فروشگاه
        </a>

      </header>


      <div id="toast" class="toast"></div>

      <section id="view"></section>

    </main>

  </div>


  <script src="/admin.js"></script>

</body>
</html>
