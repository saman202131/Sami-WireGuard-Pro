<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>داشبورد | Sami WireGuard</title><link rel="stylesheet" href="/style.css"></head><body><header class="nav"><a class="brand" href="/">SAMI <span>WIREGUARD</span></a><a class="ghost" href="/">فروشگاه</a></header><main class="section"><div class="section-head"><p class="eyebrow">DASHBOARD</p><h2>داشبورد کاربر</h2></div><div id="me" class="product">در حال بارگذاری...</div><div class="section" style="padding:30px 0"><h2>سفارش‌ها</h2><div id="orders" class="grid"></div></div><div class="section" style="padding:30px 0"><h2>سرویس‌های من</h2><div id="services" class="grid"></div></div><div class="section" style="padding:30px 0"><h2>تیکت پشتیبانی</h2><div class="product"><input id="sub" placeholder="موضوع"><textarea id="msg" style="width:100%;min-height:120px;background:#050b14;color:#fff;border:1px solid #162845;border-radius:10px;padding:12px"></textarea><button class="primary" onclick="ticket()">ارسال تیکت</button><p id="ticketMsg"></p></div></div></main><script>
const token=localStorage.getItem("sami_token");if(!token)location.href="/";
async function api(u,o={}){o.headers={...(o.headers||{}),Authorization:"Bearer "+token};let r=await fetch(u,o),j=await r.json();if(!r.ok)throw Error(j.error||"خطا");return j}
async function init(){let m=await api("/api/me");document.querySelector("#me").innerHTML=`<h3>${m.user.name}</h3><p>Telegram ID: <b>${m.user.telegramId}</b></p><p>Username: ${m.user.username?"@"+m.user.username:"—"} · امتیاز: ${m.user.points}</p>`;let os=await api("/api/orders/my");document.querySelector("#orders").innerHTML=os.length?os.map(o=>`<article class="product"><h3>${o.productName}</h3><p>شناسه: ${o.id}</p><p>وضعیت: ${o.status}</p><p>مبلغ: ${o.total}</p>${o.delivery?`<p>${o.delivery.link?`<a class="primary" href="${o.delivery.link}" target="_blank">لینک سرویس</a>`:""} ${o.delivery.config?`<a class="ghost" href="${o.delivery.config}">دانلود .conf</a>`:""}</p>${o.delivery.qr?`<img src="${o.delivery.qr}" style="width:180px">`:""}<p>${o.delivery.notes||""}</p>`:""}</article>`).join(""):"<p>هنوز سفارشی ندارید.</p>";let ss=await api("/api/services/my");document.querySelector("#services").innerHTML=ss.length?ss.map(s=>`<article class="product"><h3>${s.title}</h3><p>${s.notes||""}</p>${s.link?`<a class="primary" href="${s.link}" target="_blank">اتصال</a>`:""} ${s.config?`<a class="ghost" href="${s.config}">.conf</a>`:""} ${s.qr?`<img src="${s.qr}" style="width:150px;display:block;margin-top:12px">`:""}</article>`).join(""):"<p>سرویسی تحویل نشده است.</p>"}
async function ticket(){try{let d=await api("/api/tickets",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({subject:document.querySelector("#sub").value,message:document.querySelector("#msg").value})});document.querySelector("#ticketMsg").textContent="تیکت ثبت شد: "+d.ticket.id}catch(e){document.querySelector("#ticketMsg").textContent=e.message}}
init().catch(e=>document.querySelector("#me").textContent=e.message);
</script></body></html>
