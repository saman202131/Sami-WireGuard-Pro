<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#05070d">
  <meta name="description" content="Sami — Colorful Star Heart. ساخته شده با عشق و Python.">
  <title>SAMI | Colorful Star Heart</title>
  <style>
    :root { color-scheme: dark; --green:#8dff52; --cyan:#40e9ff; --pink:#ff4aa2; }
    * { box-sizing: border-box; }
    body {
      margin:0; min-height:100vh; overflow:hidden; background:
      radial-gradient(ellipse at 50% 45%, #101a2b 0%, #080b13 44%, #030407 100%);
      color:#fff; font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
    }
    .wrap { position:relative; min-height:100svh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:22px 14px 30px; }
    header { z-index:2; text-align:center; margin-bottom:4px; }
    .brand { font-size:clamp(2.7rem,10vw,5rem); line-height:1; letter-spacing:.16em; font-weight:1000; color:var(--green); text-shadow:0 0 10px #8dff5270,0 0 34px #8dff5260; }
    .sub { margin-top:12px; color:#e7edf7; font-size:clamp(.85rem,3.5vw,1.05rem); letter-spacing:.03em; }
    .sub b { color:var(--cyan); }
    .stage { width:min(94vw,720px); height:min(67vh,590px); min-height:320px; position:relative; }
    canvas { width:100%; height:100%; display:block; }
    .badge { z-index:2; border:1px solid #ffffff25; border-radius:999px; padding:9px 15px; color:#c9d5e6; background:#ffffff08; font-size:.78rem; letter-spacing:.04em; box-shadow:0 0 25px #40e9ff0d; }
    .badge span { color:var(--pink); }
    .footer { position:absolute; bottom:max(14px,env(safe-area-inset-bottom)); color:#8490a5; font-size:.76rem; text-align:center; }
    .footer strong { color:#dce5f2; }
    .sparkle { position:absolute; color:#a8ff75; opacity:.7; animation:blink 2.4s infinite ease-in-out; }
    .s1 { top:20%; left:12%; font-size:22px; }.s2 { top:28%; right:11%; font-size:17px; animation-delay:.7s; }.s3 { bottom:22%; left:17%; font-size:14px; animation-delay:1.1s; }.s4 { bottom:25%; right:16%; font-size:22px; animation-delay:.4s; }
    @keyframes blink { 0%,100%{opacity:.22;transform:scale(.8) rotate(0)} 50%{opacity:1;transform:scale(1.2) rotate(18deg)} }
    @media (max-height:650px) { .wrap{padding-top:10px}.brand{font-size:2.7rem}.stage{height:57vh;min-height:260px}.footer{position:static;margin-top:10px} }
  </style>
</head>
<body>
  <main class="wrap">
    <span class="sparkle s1">✧</span><span class="sparkle s2">✦</span>
    <span class="sparkle s3">✧</span><span class="sparkle s4">✦</span>
    <header>
      <div class="brand">SAMI</div>
      <div class="sub">♥ <b>Colorful Star Heart</b> · قلب رنگی ستاره‌ای</div>
    </header>
    <div class="stage"><canvas id="heart" aria-label="قلب رنگی متحرک"></canvas></div>
    <div class="badge">MADE WITH <span>♥</span> BY SAMI</div>
    <div class="footer">یک اثر کوچک با <strong>Python & Web</strong> · ساخته‌شده توسط <strong>SAMI</strong> 💚</div>
  </main>
<script>
(() => {
  const canvas = document.getElementById('heart');
  const ctx = canvas.getContext('2d');
  let w, h, dpr, points = [], stars = [], phase = 0;
  const colors = ['#ff315a','#ff9d00','#fff23b','#8dff52','#40e9ff','#458bff','#c15bff','#ff55b8','#ffffff','#00ffd0'];
  function resize() {
    const r = canvas.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = r.width; h = r.height;
    canvas.width = Math.floor(w*dpr); canvas.height = Math.floor(h*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    const scale = Math.min(w/36, h/34) * .93;
    points = [];
    for(let i=0;i<170;i++){
      const t = Math.PI*2*i/170;
      const x = 16*Math.pow(Math.sin(t),3);
      const y = 13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);
      points.push({x:w/2+x*scale,y:h*.55-y*scale,c:colors[Math.floor(Math.random()*colors.length)],s:2.5+Math.random()*3.2});
    }
    stars = Array.from({length:65},()=>({x:Math.random()*w,y:Math.random()*h,r:.4+Math.random()*1.5,a:Math.random()*6.28,s:.003+Math.random()*.01}));
  }
  function frame(){
    phase += .018;
    ctx.clearRect(0,0,w,h);
    // quiet twinkling background
    for(const st of stars){
      st.a += st.s;
      ctx.globalAlpha=.18+.55*(.5+.5*Math.sin(st.a));
      ctx.fillStyle='#d8faff'; ctx.beginPath(); ctx.arc(st.x,st.y,st.r,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha=1;
    const pulse=1+Math.sin(phase)*.018;
    const cx=w/2, cy=h*.55;
    for(let i=0;i<points.length;i++){
      const p=points[i], x=cx+(p.x-cx)*pulse, y=cy+(p.y-cy)*pulse;
      ctx.beginPath(); ctx.moveTo(cx,cy+8); ctx.lineTo(x,y);
      ctx.strokeStyle=p.c; ctx.globalAlpha=.52; ctx.lineWidth=.8; ctx.shadowBlur=5; ctx.shadowColor=p.c; ctx.stroke();
      ctx.globalAlpha=1; ctx.shadowBlur=10; ctx.fillStyle=p.c; ctx.beginPath(); ctx.arc(x,y,p.s*(1+Math.sin(phase+i)*.12),0,Math.PI*2); ctx.fill();
      if(i%5===0){ctx.font='13px sans-serif';ctx.fillText('✦',x-4,y+4);}
    }
    ctx.shadowBlur=0;ctx.globalAlpha=1;
    ctx.beginPath();ctx.arc(cx,cy+8,5,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();
    requestAnimationFrame(frame);
  }
  window.addEventListener('resize',resize);
  resize(); frame();
})();
</script>
</body>
</html>
