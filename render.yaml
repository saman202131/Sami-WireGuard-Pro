services:
  - type: web
    name: sami-wireguard-pro-max
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: DATA_DIR
        value: /var/data
      - key: SUPPORT_USERNAME
        value: saman_s87
      - key: CHANNEL_URL
        value: https://t.me/SamiWireGuard
      - key: TELEGRAM_BOT_USERNAME
        value: sami91928bot
      - key: MINI_APP_URL
        value: https://sami-wireguard-pro.onrender.com
      - key: MINI_APP_TITLE
        value: Sami WireGuard PRO MAX
      - key: TEST_MODE
        value: "true"
    disk:
      name: sami-wireguard-data
      mountPath: /var/data
      sizeGB: 1
