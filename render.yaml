services:
  - type: web
    name: sami-wireguard-pro-max
    runtime: node
    plan: starter
    buildCommand: python3 -m pip install --upgrade pip && python3 -m pip install -r stickerbot_worker/requirements.txt && npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: BOT_TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: PYTHON_BIN
        value: python3
      - key: DATA_DIR
        value: /var/data
      - key: SUPPORT_USERNAME
        value: saman_s87
      - key: CHANNEL_URL
        value: https://t.me/SamiWireGuard
      - key: TEST_MODE
        value: "true"
    disk:
      name: sami-wireguard-data
      mountPath: /var/data
      sizeGB: 1
