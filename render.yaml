services:
  - type: web
    name: custom-store-template
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: DATA_DIR
        value: /var/data
      - key: MINI_APP_TITLE
        value: فروشگاه آنلاین شما
      - key: TEST_MODE
        value: "true"
    disk:
      name: store-template-data
      mountPath: /var/data
      sizeGB: 1
