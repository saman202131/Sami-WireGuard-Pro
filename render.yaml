services:
  - type: web
    name: sami-premium-sticker-studio
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_IMAGE_MODEL
        value: gpt-image-1.5
      - key: BOT_TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: DATA_DIR
        value: /var/data
      - key: PYTHON_BIN
        value: /opt/sticker-venv/bin/python
    disk:
      name: sami-premium-data
      mountPath: /var/data
      sizeGB: 1
